<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard Architect — Vanilla TS + @ghchinoy/livebridge</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #090d16;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 1.2rem;
      }
      .layout {
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 672px 1fr;
        gap: 1.1rem;
      }
      @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; } }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      canvas#board {
        width: 100%;
        aspect-ratio: 640 / 400;
        background: #030712;
        border-radius: 12px;
        border: 1px solid #334155;
        cursor: crosshair;
        touch-action: none;
      }
      canvas#spectrum {
        width: 100%;
        height: 44px;
        background: #030712;
        border-radius: 8px;
      }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
      button {
        padding: 0.48rem 0.9rem;
        border-radius: 999px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: #38bdf8; color: #082f49; border-color: transparent; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #transcript {
        height: 330px;
        overflow-y: auto;
        background: #030712;
        border-radius: 12px;
        padding: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .turn { padding: 0.5rem 0.75rem; border-radius: 10px; max-width: 88%; font-size: 0.88rem; }
      .turn.user { align-self: flex-end; background: #1d4ed8; }
      .turn.assistant { align-self: flex-start; background: #1e293b; }
      .turn.tool { align-self: stretch; background: #0f172a; border: 1px solid #334155; font-family: ui-monospace, monospace; font-size: 0.76rem; }
      input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #030712;
        color: #f8fafc;
      }
      .meta { font-size: 0.78rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>Shared Architecture Whiteboard (Draw Freehand + Voice WebMCP)</strong>
          <button id="clear-btn">Clear Ink &amp; Nodes</button>
        </div>
        <canvas id="board" width="640" height="400"></canvas>
        <div class="meta" id="timing">Draw on the canvas with your mouse—each stroke sends a live JPEG snapshot to Gemini.</div>
      </section>

      <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>Whiteboard Architect (Vanilla TS)</strong>
          <span id="status" class="meta">Idle</span>
        </div>
        <canvas id="spectrum" width="380" height="44"></canvas>
        <div class="row">
          <button id="start-btn" class="primary">Connect Architect</button>
          <button id="mic-btn" disabled>Mute Mic</button>
          <button id="mute-btn" disabled>Mute Speaker</button>
          <button id="end-btn" disabled>End</button>
        </div>
        <div id="transcript" aria-live="polite"></div>
        <form id="prompt-form" class="row">
          <input id="prompt-input" placeholder="e.g. Diagram a CDN -> API Gateway -> Worker Queue -> Postgres flow" />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
