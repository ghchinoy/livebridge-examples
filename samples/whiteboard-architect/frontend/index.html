<html lang="en" data-theme="system" class="lustrous-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard Architect — Vanilla TS + @ghchinoy/livebridge</title>
    <style>
      .board-grid {
        display: grid;
        grid-template-columns: minmax(0, 672px) minmax(0, 1fr);
        gap: var(--lustrous-space-l);
        align-items: start;
      }
      @media (max-width: 1060px) {
        .board-grid {
          grid-template-columns: 1fr;
        }
      }
      canvas#board {
        width: 100%;
        aspect-ratio: 640 / 400;
        border-radius: var(--lustrous-radius-l);
        border: 1px solid var(--lustrous-color-outline-variant);
        cursor: crosshair;
        touch-action: none;
        display: block;
      }
      canvas#spectrum {
        width: 100%;
        height: 44px;
        border-radius: var(--lustrous-radius-m);
        border: 1px solid var(--lustrous-color-outline-variant);
        display: block;
      }
      .transcript {
        height: 330px;
      }
      .turn {
        max-width: 88%;
        align-self: flex-start;
      }
      .turn.user {
        align-self: flex-end;
      }
      .turn.tool {
        max-width: 100%;
        align-self: stretch;
      }
    </style>
  </head>
  <body>
    <lustrous-flex
      direction="column"
      gap="l"
      padding="l"
      mobile-padding="m"
      max-width="1240"
      margin-inline="auto"
    >
      <lustrous-flex align="center" justify="space-between" gap="m" wrap="wrap">
        <lustrous-flex align="center" gap="s" wrap="wrap">
          <lustrous-text variant="headline-medium" heading="1">
            Whiteboard Architect
          </lustrous-text>
          <lustrous-badge tone="cobalt">Vanilla TS</lustrous-badge>
          <lustrous-badge id="status" tone="default">Idle</lustrous-badge>
        </lustrous-flex>
        <lustrous-segmented-control
          id="theme-toggle"
          size="s"
          label="Color theme"
        ></lustrous-segmented-control>
      </lustrous-flex>

      <div class="board-grid">
        <lustrous-flex
          direction="column"
          gap="m"
          padding="l"
          background="surface-bright"
          border
          border-radius="xl"
          shadow="1"
        >
          <lustrous-flex align="center" justify="space-between" gap="s" wrap="wrap">
            <lustrous-text variant="headline-small" heading="2">
              Shared Architecture Canvas
            </lustrous-text>
            <lustrous-button id="clear-btn" variant="outline" size="s" icon="delete">
              Clear Ink &amp; Nodes
            </lustrous-button>
          </lustrous-flex>
          <canvas id="board" width="640" height="400"></canvas>
          <lustrous-text id="timing" variant="body-small" muted>
            Draw on the canvas with your mouse—each stroke sends a live JPEG snapshot to Gemini.
          </lustrous-text>
        </lustrous-flex>

        <lustrous-flex
          direction="column"
          gap="m"
          padding="l"
          background="surface-bright"
          border
          border-radius="xl"
          shadow="1"
        >
          <lustrous-text variant="headline-small" heading="2">
            Voice WebMCP &amp; Transcript
          </lustrous-text>
          <lustrous-banner
            id="warning-banner"
            variant="warning"
            icon="warning"
            layout="row"
            hidden
          ></lustrous-banner>
          <canvas id="spectrum" width="380" height="44"></canvas>
          <lustrous-flex wrap="wrap" gap="s" align="center">
            <lustrous-button id="start-btn" variant="accent" size="s" icon="play">
              Connect Architect
            </lustrous-button>
            <lustrous-togglable-button id="mic-btn" size="s" icon="micOff" disabled>
              Unmute Mic
            </lustrous-togglable-button>
            <lustrous-togglable-button id="mute-btn" size="s" icon="volumeUp" disabled>
              Mute Speaker
            </lustrous-togglable-button>
            <lustrous-button id="end-btn" variant="outline" size="s" icon="stop" disabled>
              End
            </lustrous-button>
          </lustrous-flex>
          <lustrous-scrollable-box
            id="transcript-box"
            class="transcript"
            scrim="both"
            label="Conversation transcript"
            background="surface-dim"
            border
            border-radius="l"
            padding="m"
            aria-live="polite"
          >
            <lustrous-flex id="transcript" direction="column" gap="s"></lustrous-flex>
          </lustrous-scrollable-box>
          <lustrous-flex gap="s" align="center">
            <lustrous-flex-item grow="1" min-width="0">
              <lustrous-text-input
                id="prompt-input"
                size="s"
                aria-label="Architecture prompt"
                placeholder="e.g. Diagram a CDN -> API Gateway -> Worker Queue -> Postgres flow"
                disabled
              ></lustrous-text-input>
            </lustrous-flex-item>
            <lustrous-button id="send-btn" size="s" icon="send" disabled>
              Send
            </lustrous-button>
          </lustrous-flex>
        </lustrous-flex>
      </div>
    </lustrous-flex>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
